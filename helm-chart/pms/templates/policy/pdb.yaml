# Limits voluntary disruptions (kubectl drain, node upgrades) to one pod at a time.
{{- range $name := list "backend" "frontend" }}
{{- $cfg := index $.Values $name }}
{{- if $cfg.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}-pdb
  namespace: {{ $.Values.namespace }}
spec:
  maxUnavailable: {{ $cfg.pdb.maxUnavailable }}
  selector:
    matchLabels:
      app: {{ $name }}
{{- end }}
{{- end }}
