# CPU-based autoscaling (metrics-server ships with k3s). When enabled, the
# Deployment omits spec.replicas so ArgoCD selfHeal does not fight the HPA.
{{- range $name := list "backend" "frontend" }}
{{- $cfg := index $.Values $name }}
{{- if $cfg.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}-hpa
  namespace: {{ $.Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}-deployment
  minReplicas: {{ $cfg.autoscaling.minReplicas }}
  maxReplicas: {{ $cfg.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $cfg.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: {{ $cfg.autoscaling.scaleDownStabilizationSeconds }}
{{- end }}
{{- end }}
