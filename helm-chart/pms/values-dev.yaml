# The chart defaults reproduce the current manifests. Add only reviewed
# development overrides here.
# Development environment overrides
# Development environment overrides

namespace: project-management-system

frontend:
  # Replica count is managed by the HPA (minReplicas in values.yaml)
  image:
    pullPolicy: IfNotPresent

backend:
  # Replica count is managed by the HPA (minReplicas in values.yaml)
  image:
    pullPolicy: IfNotPresent


database:
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    claimName: postgres-pvc
    size: 5Gi


gateway:
  enabled: true
  httpRoute:
    enabled: true
