namespace: project-management-system
frontend:
  image:
    repository: binheo2445/pms_frontend
    tag: 1bfd9646305311b1dd5af6234d334f14905b5d51
    pullPolicy: IfNotPresent
  containerPort: 80
  service:
    name: frontend-service
    port: 8080
    targetPort: 80
    type: ClusterIP
  env:
    VITE_API_URL: /api
  replicaCount: 3              # used only when autoscaling.enabled=false
  strategy:
    maxSurge: 1
    maxUnavailable: 0          # never drop below the desired ready count during a rollout
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 64Mi             # no CPU limit: avoids throttling
  probes:
    path: /
    startup:   { periodSeconds: 5, failureThreshold: 6 }
    readiness: { periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3 }
    liveness:  { periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3 }
  pdb:
    enabled: true
    maxUnavailable: 1
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    scaleDownStabilizationSeconds: 300

backend:
  image:
    repository: binheo2445/pms_backend
    tag: 1bfd9646305311b1dd5af6234d334f14905b5d51
    pullPolicy: IfNotPresent
  containerPort: 5000
  service:
    name: backend-service
    port: 5000
    targetPort: 5000
    type: ClusterIP
  existingSecret: backend-secret
  secretKeys:
    databaseUrl: DATABASE_URL
    accessTokenSecret: ACCESS_TOKEN_SECRET
  secret:
    create: false
  replicaCount: 3              # used only when autoscaling.enabled=false
  strategy:
    maxSurge: 1
    maxUnavailable: 0
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 384Mi
  probes:
    path: /health              # served at the root, does not touch the DB
    # The container runs "prisma db push" before starting: allow up to 180s.
    startup:   { periodSeconds: 5, failureThreshold: 36 }
    readiness: { periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3 }
    liveness:  { periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3 }
  pdb:
    enabled: true
    maxUnavailable: 1
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    scaleDownStabilizationSeconds: 300

database:
  image:
    repository: postgres
    tag: "15"
    pullPolicy: IfNotPresent
  containerPort: 5432
  service:
    name: postgres-service
    port: 5432
    targetPort: 5432
    type: ClusterIP
  existingSecret: postgres-secret
  secretKeys:
    user: POSTGRES_USER
    password: POSTGRES_PASSWORD
    database: POSTGRES_DB
  secret:
    create: false
  persistence:
    enabled: true
    claimName: postgres-pvc
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    storageClassName: local-path
    mountPath: /var/lib/postgresql/data
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
# Shared HA settings for the stateless workloads (backend, frontend)

highAvailability:
  topologySpread:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
  # Default is 300s; replace pods on a dead node after ~40s detection + 30s
  nodeFailureTolerationSeconds: 30
config:
  data:
    POSTGRES_DB: PMS
    POSTGRES_PORT: "5432"
    POSTGRES_HOST: postgres-service
    
gateway:
  enabled: true
  gatewayClass:
    create: true
    name: traefik-gateway-class
    controllerName: traefik.io/gateway-controller
  name: backend-gateway
  className: traefik-gateway-class
  listener:
    name: http
    protocol: HTTP
    port: 8000
    allowedRoutes:
      namespaces:
        from: All
  httpRoute:
    enabled: true
    name: backend-http-route
    parentRefs:
      - name: backend-gateway
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /api
        backendRefs:
          - name: backend-service
            port: 5000
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - name: frontend-service
            port: 8080
