# Values for prometheus-community/kube-prometheus-stack 93.4.1, tuned for K3s on Raspberry Pi.
#
# Playbook 07 passes a second, generated values file that sets:
#   - nodeSelector of every component to the monitoring node (first worker)
#   - kubeEtcd.endpoints to the control-plane IPs

# Short resource names: monitoring-prometheus, monitoring-grafana, ...
fullnameOverride: monitoring

# ---------------------------------------------------------------- K3s targets
# K3s runs the scheduler, controller-manager and kube-proxy inside the k3s process,
# so there is nothing to scrape for them separately.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# etcd metrics are exposed on <server-ip>:2381 once "etcd-expose-metrics: true"
# is set in /etc/rancher/k3s/config.yaml (playbook 07, play 1).
kubeEtcd:
  enabled: true
  service:
    enabled: true
    port: 2381
    targetPort: 2381

defaultRules:
  rules:
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

# ------------------------------------------------------------------ Prometheus
prometheus:
  prometheusSpec:
    scrapeInterval: 30s
    evaluationInterval: 30s
    retention: 7d
    # The Raspberry Pi nodes have a ~14 GB SD card (~11 GB free after the OS) shared with
    # images and a PostgreSQL instance. local-path does not enforce the PVC size, so
    # retentionSize is the real cap: Prometheus deletes the oldest blocks above 3 GB.
    retentionSize: 3GB

    # Pick up every ServiceMonitor/PodMonitor/PrometheusRule in the cluster
    # (Traefik, CloudNativePG, ...), not only the ones created by this chart.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1536Mi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 4Gi

# ---------------------------------------------------------------- Alertmanager
# Installed without receivers for now; notification channels are configured later.
alertmanager:
  alertmanagerSpec:
    retention: 120h
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi

# --------------------------------------------------------------------- Grafana
grafana:
  # Admin credentials come from a secret created by playbook 07 (Ansible Vault)
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi

  defaultDashboardsTimezone: browser

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# ------------------------------------------------------------------- Exporters
kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

# node-exporter runs on every node (DaemonSet), including control-plane nodes
prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 64Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
