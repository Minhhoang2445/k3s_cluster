# Grafana through the existing Traefik Gateway (http://grafana.pms.local).
# Add "<node-ip> grafana.pms.local" to /etc/hosts on the client.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: backend-gateway
      namespace: project-management-system
  hostnames:
    - grafana.pms.local
  rules:
    # The pms route sends PathPrefix /api (any host) to the PMS backend. Grafana's UI also
    # calls /api/*, so match it explicitly here: Host + /api outranks the host-less /api rule.
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: monitoring-grafana
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: monitoring-grafana
          port: 80
