# Grafana through the existing Traefik Gateway (http://grafana.pms.local).
# Add "<node-ip> grafana.pms.local" to /etc/hosts on the client.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: backend-gateway
      namespace: project-management-system
  hostnames:
    - grafana.pms.local
  rules:
    - backendRefs:
        - name: monitoring-grafana
          port: 80
