# Values for cloudnative-pg/cloudnative-pg 0.29.2 (operator 1.30.2), installed by playbook 08.
# Only the operator is installed here; the PostgreSQL cluster itself is a "Cluster"
# object in manifests/pms.

# CRDs (Cluster, Backup, Pooler, ...) are templates of this chart, so helm upgrade
# also upgrades them.
crds:
  create: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

# Operator metrics. The PodMonitor CRD comes from kube-prometheus-stack
# (playbook 07), which site.yml runs before playbook 08.
monitoring:
  podMonitorEnabled: true
