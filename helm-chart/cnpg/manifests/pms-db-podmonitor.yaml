# Scrapes the PostgreSQL instances of the CloudNativePG cluster "pms-db"
# (port "metrics" = 9187 on every instance pod: replication lag, connections, WAL, ...).
# Applied by playbook 08. Created explicitly because
# Cluster.spec.monitoring.enablePodMonitor is deprecated in operator 1.30.
# The operator's own PodMonitor comes from the Helm chart (monitoring.podMonitorEnabled).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pms-db
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - project-management-system
  selector:
    matchLabels:
      cnpg.io/cluster: pms-db
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
