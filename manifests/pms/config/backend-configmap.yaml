# Non-secret database settings. Credentials are NOT here: they live in the
# "backend-secret" / "pms-db-app" Secrets created by Ansible from the Vault.
# POSTGRES_HOST is the CloudNativePG "-rw" Service (always the current primary).
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: project-management-system
data:
  POSTGRES_DB: pms
  POSTGRES_HOST: pms-db-rw
  POSTGRES_PORT: "5432"
