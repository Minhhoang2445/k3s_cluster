# Frontend (static build served by nginx) on port 80.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: project-management-system
spec:
  # No "replicas" field: the pod count is owned by frontend-hpa (3-4 pods).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # Spread replicas across nodes (see backend/deployment.yaml)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: frontend
      # Evict pods from a failed node after 30s instead of 300s
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      containers:
        - name: frontend-container
          image: binheo2445/pms_frontend:1bfd9646305311b1dd5af6234d334f14905b5d51
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: VITE_API_URL
              value: "/api"
          # nginx starts fast: up to 6 x 5s = 30s
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 32Mi
