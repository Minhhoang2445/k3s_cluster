# Path-based routing for the PMS application (no hostname: matches any host).
#   /api/... -> backend-service:5000
#   /...     -> frontend-service:8080
# The longest matching prefix wins, so /api is chosen before /.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-http-route
  namespace: project-management-system
spec:
  parentRefs:
    - name: backend-gateway
  rules:
    - backendRefs:
        - name: backend-service
          port: 5000
      matches:
        - path:
            type: PathPrefix
            value: /api
    - backendRefs:
        - name: frontend-service
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /
