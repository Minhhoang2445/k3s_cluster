---
# Common K3s and tooling versions (pinned for reproducibility across servers and workers)
k3s_version: "v1.31.2+k3s1"
k3s_install_script_url: "https://get.k3s.io"
k3s_install_script_path: "/usr/local/bin/k3s-install.sh"
k3s_binary_path: "/usr/local/bin/k3s"

# Architecture support
k3s_supported_architectures:
  - "aarch64"
  - "x86_64"

# Raspberry Pi boot configuration
rpi_cmdline_path: "/boot/firmware/cmdline.txt"
rpi_device_tree_model_path: "/proc/device-tree/model"
rpi_extra_modules_package: "linux-modules-extra-raspi"
rpi_required_cgroup_params:
  - "cgroup_enable=cpuset"
  - "cgroup_memory=1"
  - "cgroup_enable=memory"
allow_rpi_reboot: true

# System preparation settings
k3s_required_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gpg
  - iptables
  - iproute2
  - socat
  - conntrack
k3s_kernel_modules:
  - overlay
  - br_netfilter
k3s_manage_firewall: false

# Bundled K3s components to disable on every server.
# Traefik is disabled so playbook 06 can install the upstream chart with HA values.
k3s_disable_components:
  - traefik

# Helm
helm_version: "v3.16.2"
helm_install_script_url: "https://raw.githubusercontent.com/helm/helm/{{ helm_version }}/scripts/get-helm-3"
helm_bin_path: "/usr/local/bin/helm"

# Traefik (upstream chart, installed by playbook 06)
traefik_release_name: "traefik"
traefik_namespace: "kube-system"
traefik_chart_repo: "https://traefik.github.io/charts"
traefik_chart_name: "traefik"
traefik_chart_version: "39.0.9"
traefik_values_file: "helm-chart/traefik/values.yaml"

# Gateway API CRDs: only applied if the Traefik chart did not install them
gateway_api_version: "v1.4.0"
gateway_api_crd_url: "https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_version }}/standard-install.yaml"

# PMS application
pms_namespace: "project-management-system"
# Plain Kubernetes manifests of the PMS application (applied by playbook 06, synced by ArgoCD)
pms_manifests_dir: "manifests/pms"
pms_manifests_remote_dir: "/home/{{ ansible_user }}/pms-manifests"
pms_backend_secret_name: "backend-secret"
pms_postgres_db: "pms"
# DATABASE_URL (backend-secret): the database owner of the CloudNativePG cluster,
# through the "-rw" Service that always points to the current primary.
pms_database_user: "{{ pms_cnpg_owner }}"
pms_postgres_service: "{{ pms_cnpg_cluster_name }}-rw"
pms_postgres_port: 5432
# CloudNativePG cluster of the PMS database (Cluster CR in manifests/pms)
pms_cnpg_cluster_name: "pms-db"
# kubernetes.io/basic-auth secret (username/password) for the database owner.
# The owner name is not secret and must match "owner" in manifests/pms/database/cnpg-cluster.yaml;
# the password comes from the Vault (vault_postgres_password).
pms_cnpg_app_secret_name: "pms-db-app"
pms_cnpg_owner: "pms"

# CloudNativePG operator (installed by playbook 08)
cnpg_namespace: "cnpg-system"
cnpg_release_name: "cnpg"
cnpg_chart_repo: "https://cloudnative-pg.github.io/charts"
cnpg_chart_name: "cloudnative-pg"
cnpg_chart_version: "0.29.2"          # operator 1.30.2
cnpg_operator_image: "ghcr.io/cloudnative-pg/cloudnative-pg:1.30.2"
# Default PostgreSQL image of operator 1.30.2; pinned in the Cluster CR as well
cnpg_postgres_image: "ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie"
cnpg_values_file: "helm-chart/cnpg/values.yaml"
cnpg_helm_timeout: "10m"

# Monitoring (kube-prometheus-stack, installed by playbook 07)
monitoring_namespace: "monitoring"
monitoring_release_name: "monitoring"
monitoring_chart_repo: "https://prometheus-community.github.io/helm-charts"
monitoring_chart_name: "kube-prometheus-stack"
monitoring_chart_version: "93.4.1"
monitoring_values_file: "helm-chart/monitoring/values.yaml"
monitoring_manifests_dir: "helm-chart/monitoring/manifests"
# Prometheus, Grafana, Alertmanager, Operator and kube-state-metrics run on this node
# so control-plane nodes keep their resources for etcd, Traefik and the database.
monitoring_node: "{{ groups['k3s_workers'][0] }}"
monitoring_grafana_admin_secret: "grafana-admin"
monitoring_helm_timeout: "20m"
# K3s server config file used to enable etcd metrics (merged with CLI flags)
k3s_config_file: "/etc/rancher/k3s/config.yaml"
k3s_etcd_metrics_port: 2381
