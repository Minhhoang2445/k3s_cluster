
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-management-system
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Minhhoang2445/k3s_cluster.git
    targetRevision: main
    # Plain Kubernetes YAML; recurse into the component folders
    # (config/, database/, backend/, frontend/, gateway/)
    path: manifests/pms
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: project-management-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
