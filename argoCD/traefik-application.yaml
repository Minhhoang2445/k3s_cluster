apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd

spec:
  project: default

  # Upstream Traefik chart + HA values file from this repo
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 39.0.9
      helm:
        releaseName: traefik
        valueFiles:
          - $values/helm-chart/traefik/values.yaml
    - repoURL: https://github.com/Minhhoang2445/ProjectManagementSystem.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Traefik and Gateway API CRDs are too large for client-side apply
      - ServerSideApply=true
